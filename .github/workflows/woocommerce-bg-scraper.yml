name: WooCommerce BG Scraper v2

on:
  workflow_dispatch:
    inputs:
      max_sites:
        description: "Limit for test run. Use 0 for full run."
        required: true
        default: "0"
      indexes:
        description: "How many latest Common Crawl indexes to scan"
        required: true
        default: "6"
      global_discovery:
        description: "Also search WooCommerce traces outside .bg. Slower, but can find .com/.eu Bulgarian shops."
        required: true
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.global_discovery }}" = "true" ]; then
            python scraper.py --indexes "${{ github.event.inputs.indexes }}" --max-sites "${{ github.event.inputs.max_sites }}" --global-discovery --workers 12
          else
            python scraper.py --indexes "${{ github.event.inputs.indexes }}" --max-sites "${{ github.event.inputs.max_sites }}" --workers 12
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: woocommerce-bg-results-v2
          path: output/
